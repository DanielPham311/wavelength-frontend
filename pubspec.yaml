name: wavelength
description: Music streaming Flutter app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ^3.32.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0
  retrofit: 4.8.0
  json_annotation: ^4.9.0

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Audio
  just_audio: ^0.9.43
  audio_service: ^0.18.16

  # Navigation
  go_router: ^14.8.1

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # Utils
  freezed_annotation: ^2.4.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  retrofit_generator: ^9.1.5

flutter:
  uses-material-design: true
  assets:
    - ./assets/images/
    - ./assets/icons/
